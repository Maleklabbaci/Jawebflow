name: Déployer sur Cloudflare Pages

# Pousse automatiquement le site en ligne à chaque push.
#
#   main                    → déploiement de PRODUCTION (jawebflow.pages.dev)
#   arena/** et autres      → déploiement d'APERÇU (une adresse par branche,
#                             sans toucher au site public)
#
# Sans les secrets ci-dessous, le travail est IGNORÉ proprement (aucun échec
# rouge) : voir docs/DEPLOIEMENT.md.
#
#   CLOUDFLARE_API_TOKEN   → Cloudflare → My Profile → API Tokens
#                            (modèle « Cloudflare Pages — Edit »)
#   CLOUDFLARE_ACCOUNT_ID  → Cloudflare → Workers & Pages → Identifiant de compte
#
# Et pour que le SITE construisé puisse joindre sa base (sinon page blanche) :
#   VITE_SUPABASE_URL      → Supabase → Project Settings → API (URL du projet)
#   VITE_SUPABASE_ANON_KEY → Supabase → Project Settings → API (clé « anon »)
# Ces deux-là peuvent être des « Variables » (et non des secrets) : elles sont
# publiques par nature, puisqu'elles finissent dans le JavaScript du site.

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois par branche ; un nouveau push annule le précédent.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Le déploiement est-il configuré ? ─────────────────────────────────
      # (Les secrets ne sont pas lisibles dans un `if` : on les lit ici, puis on
      #  décide, pour ne pas offrir un échec rouge à chaque push.)
      - name: Les secrets Cloudflare sont-ils en place ?
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN absent → déploiement ignoré. Voir docs/DEPLOIEMENT.md."
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == '1'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installer
        if: steps.guard.outputs.ready == '1'
        run: npm ci --no-audit --no-fund

      # ── On ne met pas en ligne du code cassé ──────────────────────────────
      # 691 tests + types. C'est ce qui rend le déploiement automatique sûr.
      - name: Types (tsc)
        if: steps.guard.outputs.ready == '1'
        run: npm run lint

      - name: Tests
        if: steps.guard.outputs.ready == '1'
        run: npm test

      # ⚠️ Vite FIGE ces deux valeurs dans le JavaScript ici même : Cloudflare ne
      # les fournit pas à une construction qui n'a pas lieu chez lui. Sans elles,
      # le garde-fou scripts/check-env.mjs arrête la construction (mieux vaut ça
      # qu'un site en ligne avec une page blanche).
      - name: Construire le site
        if: steps.guard.outputs.ready == '1'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:pages

      - name: Déployer (production sur main, aperçu ailleurs)
        if: steps.guard.outputs.ready == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=jawebflow --branch="${{ github.ref_name }}"
